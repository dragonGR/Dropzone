<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropzone</title>
  <link rel="icon" type="image/svg+xml" href="/s/{{TOKEN}}/icon.svg">
  <link rel="stylesheet" href="/s/{{TOKEN}}/style.css">
</head>
<body>
  <main class="card" role="region" aria-label="Shared File Download">
    <header class="card-header">
      <h1 class="brand-title">Dropzone</h1>
    </header>

    <section class="file-info">
      <div class="file-icon" aria-hidden="true">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="18" x2="12" y2="12"></line>
          <polyline points="9 15 12 18 15 15"></polyline>
        </svg>
      </div>
      <h2 class="filename" id="file-name">{{FILE_NAME}}</h2>
      <p class="filesize" aria-label="File size">{{FILE_SIZE}}</p>
    </section>

    <div class="action-container">
      <a href="{{DOWNLOAD_URL}}" id="download-btn" class="download-button" aria-describedby="file-name">
        Download
      </a>
    </div>
  </main>
</body>
</html>
