name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            git \
            gcc \
            pkgconf-pkg-config \
            gtk4-devel \
            libadwaita-devel \
            meson \
            ninja-build \
            gettext \
            desktop-file-utils \
            appstream \
            rust \
            cargo \
            clippy \
            rustfmt

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Build and test with Meson
        run: |
          meson setup build
          ninja -C build test
