<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512">
  <defs>
    <!-- Soft Contact Shadows (GNOME App Icon HIG) -->
    <filter id="shadow-base" x="-10%" y="-5%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.22" />
    </filter>

    <filter id="shadow-beacon" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0e376c" flood-opacity="0.45" />
    </filter>

    <filter id="shadow-arrow" x="-25%" y="-15%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="1.8" flood-color="#0f3b73" flood-opacity="0.4" />
    </filter>

    <!-- GNOME Palette Gradients & Fills -->
    <!-- Base slab: GNOME Blue 3 to Blue 4 overhead light -->
    <linearGradient id="gnome-blue-slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3584e4" />
      <stop offset="60%" stop-color="#1c71d8" />
      <stop offset="100%" stop-color="#1a5fb4" />
    </linearGradient>

    <!-- Base 3D bottom bevel -->
    <linearGradient id="gnome-blue-bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a5fb4" />
      <stop offset="100%" stop-color="#154b8c" />
    </linearGradient>

    <!-- Top rim highlight -->
    <linearGradient id="top-rim-highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Inner drop target recess -->
    <linearGradient id="target-recess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16519b" />
      <stop offset="100%" stop-color="#1f69c5" />
    </linearGradient>

    <!-- Beacon Warm/Gold Accent (GNOME Gold 2 to 3) -->
    <linearGradient id="gnome-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8e45c" />
      <stop offset="100%" stop-color="#f5c211" />
    </linearGradient>
  </defs>

  <!-- ================= BASE CANVAS / CONTACT SHADOW ================= -->
  <!-- GNOME Base Squircle Slab: width 96, height 96, r=22 (fits within standard 128x128 grid: 16px margins) -->
  
  <!-- 3D Lower Rim / Bevel Layer for Tactile GNOME Depth -->
  <g filter="url(#shadow-base)">
    <!-- Bottom Bevel / Thickness (down 3px) -->
    <rect x="16" y="20" width="96" height="96" rx="22" ry="22" fill="url(#gnome-blue-bevel)" />
    
    <!-- Main Upper Slab -->
    <rect x="16" y="16" width="96" height="96" rx="22" ry="22" fill="url(#gnome-blue-slab)" />
  </g>

  <!-- Top Edge Rim Highlight (1px crisp overhead sheen) -->
  <path d="M 38 16 L 90 16 A 22 22 0 0 1 112 38 L 112 40 A 22 22 0 0 0 90 18 L 38 18 A 22 22 0 0 0 16 40 L 16 38 A 22 22 0 0 1 38 16 Z" fill="url(#top-rim-highlight)" />

  <!-- ================= DROPZONE TARGET / SIGNAL FIELD ================= -->
  <!-- Subtle tactile circular recess in center of the slab -->
  <circle cx="64" cy="64" r="38" fill="url(#target-recess)" opacity="0.65" />
  <!-- Crisp inner bottom reflection in the recess -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Outer Concentric Wi-Fi / Radar Radar Waves (Ephemeral Wi-Fi Radiation) -->
  <!-- Outer Ring (Broken into 4 dynamic target arcs for a tactile "Dropzone" crosshair aesthetic) -->
  <circle cx="64" cy="64" r="31" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="14 10" stroke-linecap="round" stroke-opacity="0.4" />
  
  <!-- Middle Radio Wave Ring -->
  <circle cx="64" cy="64" r="22" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.65" />

  <!-- Inner Radio Wave Ring / Landing Ring -->
  <circle cx="64" cy="64" r="14" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 4" stroke-opacity="0.5" />

  <!-- 4 Directional Landing Corner Notches (Targeting Crosshairs in GNOME style) -->
  <path d="M 64 28 L 64 34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
  <path d="M 64 94 L 64 100" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
  <path d="M 28 64 L 34 64" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
  <path d="M 94 64 L 100 64" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- ================= FOREGROUND: DROP BEACON & DOWNWARD ARROW ================= -->
  <!-- Center Elevated Landing Beacon Base (Tactile floating disc) -->
  <g filter="url(#shadow-beacon)">
    <!-- Beacon disc rim -->
    <circle cx="64" cy="65" r="18" fill="#134585" />
    <!-- Beacon disc top surface (clean GNOME light clean white/silver) -->
    <circle cx="64" cy="64" r="18" fill="#f6f5f4" />
    <circle cx="64" cy="64" r="18" fill="none" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Geometric GNOME Drop Arrow (Representing files landing into the local ephemeral server) -->
  <g filter="url(#shadow-arrow)">
    <!-- Drop Arrow Base / Shaft & Head -->
    <!-- Distinct downward arrow with rounded terminals -->
    <path d="M 64 77 
             L 53 66 C 52 65 52.5 63.5 54 63.5 
             L 59.5 63.5 
             L 59.5 53 C 59.5 51.8 60.5 51 61.7 51 
             L 66.3 51 C 67.5 51 68.5 51.8 68.5 53 
             L 68.5 63.5 
             L 74 63.5 C 75.5 63.5 76 65 75 66 
             Z" 
          fill="url(#gnome-blue-slab)" />
    <!-- Arrow top edge highlight -->
    <path d="M 60 51.5 L 68 51.5" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.6" />
  </g>

  <!-- Glowing Ephemeral Broadcast Dot (GNOME Gold Accent) in the drop beacon head -->
  <circle cx="64" cy="58" r="2.2" fill="url(#gnome-gold)" />
  <circle cx="64" cy="58" r="2.2" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.7" />

  <!-- Subtle Top Ambient Glint on the Beacon Surface -->
  <ellipse cx="64" cy="50" rx="9" ry="2.5" fill="#ffffff" fill-opacity="0.15" />
</svg>
